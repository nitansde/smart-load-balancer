name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install cross compilers
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break || sleep 20
          done
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 gcc-mingw-w64-aarch64 zip

      - name: Install zig (darwin cross builds)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make zip VERSION="$VERSION"
          ls -la dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
